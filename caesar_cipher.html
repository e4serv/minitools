<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>シーザー暗号ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white text-left">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-indigo-200 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z" />
                </svg>
                <h1 class="text-2xl font-bold tracking-tight">シーザー暗号ツール</h1>
            </div>
            <p class="text-indigo-200 mt-1 text-sm">テキストをシフトして暗号化・復号化します (アルファベットのみ対応)</p>
        </div>

        <div class="p-6 sm:p-8 space-y-6">
            <!-- Input Section -->
            <div class="space-y-2">
                <label for="inputText" class="block text-sm font-semibold text-gray-700">入力テキスト</label>
                <textarea id="inputText" rows="4" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow resize-none" placeholder="ここに暗号化または復号化したいテキストを入力してください... (例: Hello World)"></textarea>
                <!-- エラーメッセージ用要素を追加 -->
                <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 p-2.5 rounded-md border border-red-200 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                    <span>アルファベットと空白文字のみを入力してください。処理を中止しました。</span>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="flex flex-col sm:flex-row gap-4 items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                <div class="flex-1 w-full flex items-center gap-3">
                    <label for="shiftValue" class="text-sm font-medium text-gray-700 whitespace-nowrap">シフト数 (キー):</label>
                    <input type="number" id="shiftValue" value="3" class="w-20 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-center font-mono">
                    <div class="flex flex-col">
                        <button onclick="adjustShift(1)" class="text-gray-500 hover:text-indigo-600 p-1 hover:bg-gray-200 rounded text-xs transition-colors">▲</button>
                        <button onclick="adjustShift(-1)" class="text-gray-500 hover:text-indigo-600 p-1 hover:bg-gray-200 rounded text-xs transition-colors">▼</button>
                    </div>
                </div>
                
                <div class="flex w-full sm:w-auto gap-2">
                    <button id="btnEncrypt" class="flex-1 sm:flex-none px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        暗号化
                    </button>
                    <button id="btnDecrypt" class="flex-1 sm:flex-none px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-md shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500">
                        復号化
                    </button>
                </div>
            </div>

            <!-- Output Section -->
            <div class="space-y-2">
                <div class="flex justify-between items-end">
                    <label for="outputText" class="block text-sm font-semibold text-gray-700">出力結果</label>
                    <button id="btnCopy" class="text-sm text-indigo-600 hover:text-indigo-800 font-medium transition-colors flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        コピー
                    </button>
                </div>
                <textarea id="outputText" rows="4" readonly class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-800 font-mono text-sm resize-none focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="結果がここに表示されます..."></textarea>
            </div>
            
            <div id="toast" class="hidden text-center text-sm text-emerald-600 font-medium py-2">
                クリップボードにコピーしました！
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const inputText = document.getElementById('inputText');
        const shiftValue = document.getElementById('shiftValue');
        const outputText = document.getElementById('outputText');
        const btnEncrypt = document.getElementById('btnEncrypt');
        const btnDecrypt = document.getElementById('btnDecrypt');
        const btnCopy = document.getElementById('btnCopy');
        const toast = document.getElementById('toast');
        const errorMsg = document.getElementById('errorMsg'); // 追加

        // Helper: Adjust Shift Value up or down
        function adjustShift(amount) {
            let currentVal = parseInt(shiftValue.value) || 0;
            shiftValue.value = currentVal + amount;
            // Optionally auto-update if there is text
            // processCipher(currentModeIsEncrypt); 
        }

        // Main Caesar Cipher Logic
        function caesarCipher(text, shift, decrypt = false) {
            if (decrypt) {
                shift = -shift;
            }

            // Normalize shift to always be a positive number between 0 and 25
            const normalizedShift = ((shift % 26) + 26) % 26;
            
            let result = '';

            for (let i = 0; i < text.length; i++) {
                let charCode = text.charCodeAt(i);

                // Uppercase letters (A-Z, 65-90)
                if (charCode >= 65 && charCode <= 90) {
                    result += String.fromCharCode(((charCode - 65 + normalizedShift) % 26) + 65);
                }
                // Lowercase letters (a-z, 97-122)
                else if (charCode >= 97 && charCode <= 122) {
                    result += String.fromCharCode(((charCode - 97 + normalizedShift) % 26) + 97);
                }
                // Other characters (spaces, numbers, Japanese, punctuation) remain unchanged
                else {
                    result += text.charAt(i);
                }
            }

            return result;
        }

        // Process function wrapper
        function processCipher(isEncrypt) {
            const text = inputText.value;
            const shift = parseInt(shiftValue.value) || 0;
            
            if (!text.trim()) {
                outputText.value = "";
                errorMsg.classList.add('hidden');
                return;
            }

            // アルファベット(a-z, A-Z)と空白文字(スペース、改行等)以外が含まれているかチェック
            if (/[^a-zA-Z\s]/.test(text)) {
                errorMsg.classList.remove('hidden'); // エラーを表示
                outputText.value = ""; // 出力結果をクリア
                return; // 処理を中止
            } else {
                errorMsg.classList.add('hidden'); // エラーを隠す
            }

            const result = caesarCipher(text, shift, !isEncrypt);
            outputText.value = result;
        }

        // Event Listeners
        btnEncrypt.addEventListener('click', () => processCipher(true));
        btnDecrypt.addEventListener('click', () => processCipher(false));

        // Copy to clipboard functionality
        btnCopy.addEventListener('click', () => {
            if (!outputText.value) return;
            
            // Using modern clipboard API with fallback
            navigator.clipboard.writeText(outputText.value).then(() => {
                showToast();
            }).catch(err => {
                // Fallback for older browsers / iframe restrictions
                outputText.select();
                document.execCommand('copy');
                window.getSelection().removeAllRanges();
                showToast();
            });
        });

        function showToast() {
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2000);
        }

        // Allow pressing Enter in shift input to trigger encrypt (default action)
        shiftValue.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                processCipher(true);
            }
        });
    </script>
</body>
</html>
